spring:
  application:
    name: antijob

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dental_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  # email-service (antijob/email-service/) giờ là consumer duy nhất của 3 topic này — booking-service
  # chỉ publish, không tự gửi email nữa (EmailService đã xoá ở Phase 18 Phase B). JSON qua
  # spring-kafka, không Avro/Schema Registry (không cần cho scope này).
  # Boot 4.1 không autoconfigure Kafka (xem config/KafkaProducerConfig.java) nên chỉ cần đúng 1
  # property này — serializer khai báo thẳng trong code, không qua spring.kafka.producer.*.
  kafka:
    # Default localhost:9094 khớp listener PLAINTEXT_HOST của docker-compose (dùng khi chạy
    # bootRun trực tiếp trên host). Trong container (antijob-app profile full), override thành
    # kafka:9092 (listener PLAINTEXT nội bộ) qua KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

jwt:
  # base64, mặc định chỉ dùng cho dev — BẮT BUỘC set JWT_SECRET riêng khi deploy thật (xem .env.example)
  secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2Q=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: antijob
