spring:
  application:
    name: antijob

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dental_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  # MailHog (dev): SMTP không cần auth tại localhost:1025, UI xem mail tại localhost:8025.
  # Prod: đổi MAIL_HOST/MAIL_PORT trỏ SMTP relay thật, set MAIL_USERNAME/MAIL_PASSWORD nếu cần auth.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

mail:
  from: ${MAIL_FROM:no-reply@vibecode-dental.local}

jwt:
  # base64, mặc định chỉ dùng cho dev — BẮT BUỘC set JWT_SECRET riêng khi deploy thật (xem .env.example)
  secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2Q=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
