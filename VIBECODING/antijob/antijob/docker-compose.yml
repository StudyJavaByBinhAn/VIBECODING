services:
  dental-db:
    image: postgres:16
    container_name: dental-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dental-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dental_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dental-redis:
    image: redis:7
    container_name: dental-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dental-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MailHog: SMTP giả lập cho dev (không gửi mail thật ra ngoài) — UI xem mail đã gửi tại
  # http://localhost:8025, SMTP không cần auth tại localhost:1025 (mặc định app trỏ vào đây).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dental-mailhog
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"

  # Kafka (KRaft mode — không cần Zookeeper) cho event đặt lịch/huỷ lịch/quên mật khẩu, dùng
  # bởi email-service (đang phát triển ở antijob/email-service/) và về sau customer-care-service.
  kafka:
    image: apache/kafka:3.9.0
    container_name: dental-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 2 listener riêng: PLAINTEXT cho container-to-container (antijob-app, email-service... nói
      # chuyện qua "kafka:9092"), PLAINTEXT_HOST cho app chạy trực tiếp trên host qua bootRun (nói
      # chuyện qua "localhost:9094") — thiếu listener thứ 2 này, client trên host nhận được cluster
      # metadata quảng cáo "kafka:9092" từ broker và không resolve được hostname đó (gotcha đã gặp
      # thật lúc verify: producer connect được bootstrap nhưng UnknownHostException khi gửi thật).
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cluster 1 node duy nhất — internal topic __consumer_offsets mặc định cần replication
      # factor 3, không bao giờ tạo được với 1 broker (consumer group không hoạt động được, dù
      # message vẫn ghi vào topic bình thường — đã xác nhận thật lúc verify: offset tăng đúng
      # nhưng console-consumer luôn thấy 0 message vì group coordinator không khởi tạo được).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # UI xem topic/message trực quan tại http://localhost:8081 — chỉ để quan sát, không cần cho app chạy.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dental-kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Chạy full app trong container (thay vì ./gradlew bootRun trên host) — không nằm trong
  # `docker compose up -d` mặc định (tránh xung đột port 8080 với dev chạy bootRun song song).
  # Bật bằng: docker compose --profile full up -d
  antijob-app:
    build: .
    container_name: antijob-app
    profiles: ["full"]
    depends_on:
      dental-db:
        condition: service_healthy
      dental-redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      kafka:
        condition: service_healthy
    # Chỉ override DB_HOST/REDIS_HOST/MAIL_HOST (bắt buộc — "localhost" không resolve được sang container
    # khác trong network) + giữ khớp credential với service postgres/redis phía trên. Cố tình
    # KHÔNG truyền JWT_SECRET/ADMIN_EMAIL/ADMIN_PASSWORD/CORS_ALLOWED_ORIGINS/SPRING_PROFILES_ACTIVE
    # qua đây: nếu host không set các biến này, `${VAR:-}` vẫn set env var thành CHUỖI RỖNG trong
    # container (khác với "chưa set") — Spring coi rỗng là "đã có giá trị" nên KHÔNG fallback về
    # default trong application.yaml nữa, phá vỡ default dev secret (lỗi thật gặp phải khi verify:
    # JwtUtil bean crash vì key rỗng). Muốn override cho môi trường prod-like, dùng `env_file: .env`
    # (không khai báo sẵn ở đây) hoặc `deploy.sh` (đã hỗ trợ đầy đủ, xem README).
    environment:
      DB_HOST: dental-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dental_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: dental-redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dental-db-data:
  dental-redis-data:
