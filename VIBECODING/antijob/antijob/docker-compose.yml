services:
  dental-db:
    image: postgres:16
    container_name: dental-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dental-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dental_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dental-redis:
    image: redis:7
    container_name: dental-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dental-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dental-db-data:
  dental-redis-data:
