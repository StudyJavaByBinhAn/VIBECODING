services:
  dental-db:
    image: postgres:16
    container_name: dental-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dental-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dental_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dental-redis:
    image: redis:7
    container_name: dental-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dental-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MailHog: SMTP giả lập cho dev (không gửi mail thật ra ngoài) — UI xem mail đã gửi tại
  # http://localhost:8025, SMTP không cần auth tại localhost:1025 (mặc định app trỏ vào đây).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dental-mailhog
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"

  # Chạy full app trong container (thay vì ./gradlew bootRun trên host) — không nằm trong
  # `docker compose up -d` mặc định (tránh xung đột port 8080 với dev chạy bootRun song song).
  # Bật bằng: docker compose --profile full up -d
  antijob-app:
    build: .
    container_name: antijob-app
    profiles: ["full"]
    depends_on:
      dental-db:
        condition: service_healthy
      dental-redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    # Chỉ override DB_HOST/REDIS_HOST/MAIL_HOST (bắt buộc — "localhost" không resolve được sang container
    # khác trong network) + giữ khớp credential với service postgres/redis phía trên. Cố tình
    # KHÔNG truyền JWT_SECRET/ADMIN_EMAIL/ADMIN_PASSWORD/CORS_ALLOWED_ORIGINS/SPRING_PROFILES_ACTIVE
    # qua đây: nếu host không set các biến này, `${VAR:-}` vẫn set env var thành CHUỖI RỖNG trong
    # container (khác với "chưa set") — Spring coi rỗng là "đã có giá trị" nên KHÔNG fallback về
    # default trong application.yaml nữa, phá vỡ default dev secret (lỗi thật gặp phải khi verify:
    # JwtUtil bean crash vì key rỗng). Muốn override cho môi trường prod-like, dùng `env_file: .env`
    # (không khai báo sẵn ở đây) hoặc `deploy.sh` (đã hỗ trợ đầy đủ, xem README).
    environment:
      DB_HOST: dental-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dental_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: dental-redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dental-db-data:
  dental-redis-data:
