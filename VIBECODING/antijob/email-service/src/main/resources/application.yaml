server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: email-service

  # Database riêng (email_service_db) trên cùng Postgres instance với booking-service — chỉ để
  # lưu audit log sent_emails, không share schema/bảng với booking-service.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:email_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Boot 4.1 không autoconfigure Kafka (xem config/KafkaConsumerConfig.java) — chỉ cần đúng
  # property này, phần còn lại khai báo tường minh trong code, giống booking-service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

  # MailHog (dev): SMTP không cần auth tại localhost:1025. Prod: đổi MAIL_HOST/MAIL_PORT sang
  # SMTP relay thật, set MAIL_USERNAME/MAIL_PASSWORD nếu cần auth.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

mail:
  from: ${MAIL_FROM:no-reply@vibecode-dental.local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Gotcha đã gặp thật ở booking-service (xem CLAUDE.md Phase 18): MailHealthIndicator mở kết
  # nối SMTP thật mỗi lần gọi /actuator/health, có thể treo cả endpoint nếu SMTP relay chậm.
  # Áp dụng luôn fix này ở đây từ đầu, không đợi gặp sự cố mới sửa.
  health:
    mail:
      enabled: false
